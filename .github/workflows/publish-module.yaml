name: Publish Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Module version to publish (e.g. 1.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-module:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build Bicep files
        run: |
          az bicep build --file petname.bicep --outfile /dev/null
          az bicep build --file test-petname.bicep --outfile /dev/null

      # Gate publishing on the assertion tests. `az bicep` does not expose
      # the test subcommand, so call the az-installed binary directly.
      - name: Run assertion tests
        run: ~/.azure/bin/bicep test tests/petname.tests.bicep

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # az bicep publish authenticates to ghcr.io via the Docker credential
      # store populated by the login step above; no Azure login is needed.
      - name: Publish module to GitHub Container Registry
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          az bicep publish \
            --file petname.bicep \
            --target "br:ghcr.io/${owner}/bicep-petname:${{ inputs.version }}"
