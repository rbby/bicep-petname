name: Publish Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKLOAD_NAME: 'bicep-petname'
  
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: read
      checks: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Replace USERNAME with your GitHub username or org name


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Bicep Module
        run: |
          MODULE_NAME="bicep-petname"
          MODULE_VERSION="1.0.0"
          PACKAGE_DIR="${MODULE_NAME}-${MODULE_VERSION}"

          # Create the module package directory
          mkdir -p ${PACKAGE_DIR}
          
          # Copy Bicep module and documentation
          cp ./petname.bicep ${PACKAGE_DIR}/
          cp ./README.md ${PACKAGE_DIR}/
          cp ./LICENSE ${PACKAGE_DIR}/
          
          # Create compressed package
          tar -czf ${PACKAGE_DIR}.tar.gz ${PACKAGE_DIR}
          
          # Publish the module to GitHub Packages
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary @${PACKAGE_DIR}.tar.gz \
            "https://api.github.com/repos/${{ github.repository }}/releases/upload?name=${PACKAGE_DIR}.tar.gz"
        
