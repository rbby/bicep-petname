name: Publish Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Module version to publish (e.g. 1.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-module:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build Bicep files
        run: |
          az bicep build --file main.bicep --outfile /dev/null
          az bicep build --file tests/e2e/defaults/main.test.bicep --outfile /dev/null

      # Gate publishing on the assertion tests. `az bicep` has no dedicated
      # `test` wrapper; `run` forwards raw commands to the installed Bicep
      # CLI regardless of where az placed it.
      - name: Run assertion tests
        run: az bicep run --command "test tests/unit/namesmith.tests.bicep"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # az bicep publish authenticates to ghcr.io via the Docker credential
      # store populated by the login step above; no Azure login is needed.
      - name: Publish module to GitHub Container Registry
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          az bicep publish \
            --file main.bicep \
            --target "br:ghcr.io/${owner}/bicep-namesmith:${{ inputs.version }}"
