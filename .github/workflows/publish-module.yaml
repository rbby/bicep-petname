name: Publish Module

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKLOAD_NAME: 'bicep-petname'
  
jobs:
  publish-module:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
      issues: read
      checks: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy package to GitHub Container Registry
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
 
            MODULE_NAME="bicep-petname"
            MODULE_VERSION="1.0.0"

            # az bicep publish \
            #   --file petname.bicep \
            #   --target br:ghcr.io/rbby/bicep-petname:1.0.0
              
            # az bicep publish \
            #   --file ./petname.bicep \
            #   --target ghcr.io/${{ github.repository_owner }}/bicep-modules/petname:${MODULE_VERSION}
    
            az bicep publish \
              --file petname.bicep \
              --target "br:ghcr.io/${{ github.repository_owner }}/bicep-petname:${MODULE_VERSION}"
