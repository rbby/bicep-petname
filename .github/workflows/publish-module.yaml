name: Publish Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKLOAD_NAME: 'bicep-petname'
  
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: read
      checks: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Replace USERNAME with your GitHub username or org name


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Bicep Module
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE_NAME="bicep-petname"
          MODULE_VERSION="1.0.0"
          PACKAGE_DIR="${MODULE_NAME}-${MODULE_VERSION}"
          TAG="v${MODULE_VERSION}"

          # Create the module package directory
          mkdir -p ${PACKAGE_DIR}
          
          # Copy Bicep module and documentation
          cp ./petname.bicep ${PACKAGE_DIR}/
          cp ./README.md ${PACKAGE_DIR}/
          cp ./LICENSE ${PACKAGE_DIR}/
          
          # Create compressed package
          tar -czf ${PACKAGE_DIR}.tar.gz ${PACKAGE_DIR}
          
          # Create or update release and upload asset
          gh release create ${TAG} ${PACKAGE_DIR}.tar.gz \
            --title "Bicep Petname Module ${MODULE_VERSION}" \
            --notes "Bicep module for generating human-readable random names for Azure resources" \
            --repo ${{ github.repository }} \
            || gh release upload ${TAG} ${PACKAGE_DIR}.tar.gz \
            --repo ${{ github.repository }}
        
