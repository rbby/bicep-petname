name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build Bicep files
        run: |
          az bicep build --file petname.bicep --outfile /dev/null
          az bicep build --file test-petname.bicep --outfile /dev/null

      # `az bicep` does not expose the test subcommand, so call the
      # az-installed binary directly
      - name: Run assertion tests
        run: ~/.azure/bin/bicep test tests/petname.tests.bicep
